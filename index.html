<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/src/assets/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Costa Franklin Advocacia</title>
    <meta name="description" content="Escritório de advocacia especializado em direito civil, trabalhista e empresarial. Atendimento personalizado e próximo." />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root{
        --brand-primary:#0b0b0c;
        --brand-accent:#d4af37;
        --brand-muted:#f8fafc;
        --brand-gold-light:#f3e8b8;
        --shadow-soft: 0 4px 20px rgba(0,0,0,0.08);
        --shadow-medium: 0 8px 32px rgba(0,0,0,0.12);
      }
      html { scroll-behavior:smooth; font-family: 'Inter', system-ui, sans-serif; }
      body { line-height: 1.7; }
      .btn-primary {
        background: linear-gradient(135deg, var(--brand-accent) 0%, #c9a332 100%);
        color: #111;
        border: none;
        box-shadow: var(--shadow-soft);
        transition: all 0.3s ease;
      }
      .btn-primary:hover {
        transform: translateY(-1px);
        box-shadow: var(--shadow-medium);
      }
      .btn-secondary {
        background: rgba(255,255,255,0.95);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(0,0,0,0.08);
        transition: all 0.3s ease;
      }
      .btn-secondary:hover {
        background: white;
        box-shadow: var(--shadow-soft);
      }
      .brand-border { border-color: rgba(0,0,0,0.08); }
      .pill { border-radius: 50px; }
      .card-hover { transition: all 0.3s ease; }
      .card-hover:hover { transform: translateY(-4px); box-shadow: var(--shadow-medium); }
      .section-padding { padding: 5rem 0; }
      .content-spacing { margin-bottom: 3rem; }
      h1, h2, h3 { font-weight: 600; letter-spacing: -0.025em; }
      .text-balance { text-wrap: balance; }

      /* Mobile Responsiveness */
      @media (max-width: 768px) {
        .section-padding { padding: 3rem 0; }
        .content-spacing { margin-bottom: 2rem; }
        .mobile-hidden { display: none !important; }
        .mobile-full { width: 100% !important; }
        .mobile-text-center { text-align: center !important; }
        .mobile-flex-col { flex-direction: column !important; }
        .mobile-gap-4 { gap: 1rem !important; }
        .mobile-px-4 { padding-left: 1rem !important; padding-right: 1rem !important; }
        .mobile-py-2 { padding-top: 0.5rem !important; padding-bottom: 0.5rem !important; }
        .mobile-text-sm { font-size: 0.875rem !important; }
        .mobile-text-base { font-size: 1rem !important; }
        .mobile-text-lg { font-size: 1.125rem !important; }
        .mobile-text-xl { font-size: 1.25rem !important; }
        .mobile-text-2xl { font-size: 1.5rem !important; }
        .mobile-text-3xl { font-size: 1.875rem !important; }
        .mobile-space-y-4 > * + * { margin-top: 1rem !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
